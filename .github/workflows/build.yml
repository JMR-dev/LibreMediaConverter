name: Build

# Pull requests are covered by status_check.yml, which runs the unit tests and the
# instrumented suite across API 33-37. This workflow keeps the post-merge and release
# duties and does not duplicate PR validation.
on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  test:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'   # AGP 9 requires JDK 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/

  release:
    name: Release
    needs: [test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release artifacts
        run: ./gradlew assembleRelease bundleRelease

      # GPL-3.0 requires that complete corresponding source accompany the binary.
      # FFmpeg's guidance says to host it on the same server as the binary; for a Play
      # listing that is impossible, so it is attached to the GitHub release next to the
      # APK and linked from both the store listing and the in-app About screen.
      - name: Assemble corresponding source
        run: |
          mkdir -p release-source
          cp -r tools/ffmpeg release-source/
          {
            echo "FFmpeg corresponding source for ${GITHUB_REF_NAME}"
            echo
            echo "Upstream: https://github.com/arthenica/ffmpeg-kit-next"
            echo "Tag:      v8.1.1  (FFmpeg 8.1.2)"
            echo
            echo "The exact configure line used is printed in the build log and is"
            echo "reproduced by running tools/ffmpeg as documented in its README."
          } > release-source/README.txt
          tar czf ffmpeg-corresponding-source.tar.gz release-source

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            ffmpeg-corresponding-source.tar.gz
            LICENSE
            LICENSES/README.md
