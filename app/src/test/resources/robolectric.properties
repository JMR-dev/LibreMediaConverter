# Robolectric defaults to the manifest's targetSdk, which is 37 here, and there is no
# android-all jar for 37 -- Robolectric 4.16.1 stops at 36 and fails the whole class with
# "Package targetSdkVersion=37 > maxSdkVersion=36" before any test body runs.
#
# 36 is where CI's emulator matrix already stops, for the unrelated reason in
# docs/api-37-emulator-crash.md, so this does not widen the gap between what is verified
# automatically and what is not: API 37 was already a manual check on the Pixel 10 Pro XL
# before each release, and still is.
#
# Set here rather than in a @Config on each class so a later Robolectric test does not have
# to rediscover it. Remove it once Robolectric ships an android-all jar for 37.
sdk=36
